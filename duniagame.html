<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cari Kata: Tata Surya</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent; /* Hilangkan kedipan biru saat disentuh di HP */
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: linear-gradient(135deg, #0b0c2a, #1b2845);
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 15px 10px;
            user-select: none;
            overflow-x: hidden;
        }

        h1 {
            color: #ffd166;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
            margin: 5px 0;
            text-align: center;
            font-size: 22px;
        }

        p {
            margin: 0 0 10px 0;
            color: #a8dadc;
            text-align: center;
            font-size: 13px;
        }

        #message {
            font-size: 16px;
            font-weight: bold;
            color: #06d6a0;
            min-height: 24px;
            margin-bottom: 8px;
            text-align: center;
        }

        /* Kontainer Utama Responsif */
        .game-container {
            display: flex;
            flex-direction: row;
            gap: 15px;
            justify-content: center;
            align-items: stretch;
            background: rgba(255, 255, 255, 0.08);
            padding: 15px;
            border-radius: 18px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
        }

        /* Papan Kotak Huruf - Ukuran otomatis mengikuti layar */
        .grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 4px;
            background: #1d3557;
            padding: 10px;
            border-radius: 14px;
            border: 3px solid #457b9d;
            width: 420px;
            height: 420px;
            flex-shrink: 0;
            touch-action: none; /* WAJIB: Mencegah layar HP ikut ter-scroll saat jari menggeser */
        }

        .cell {
            background: #f1faee;
            color: #1d3557;
            font-size: 18px;
            font-weight: bold;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.15s, transform 0.1s;
        }

        .cell.selected {
            background: #ffd166;
            color: #000;
            transform: scale(1.08);
            z-index: 2;
        }

        .cell.found {
            background: #06d6a0;
            color: white;
            animation: pop 0.3s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        /* Daftar Kata yang Dicari */
        .word-list-box {
            background: #1d3557;
            padding: 15px;
            border-radius: 14px;
            border: 3px solid #457b9d;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .word-list-box h2 {
            margin: 0 0 12px 0;
            color: #ffd166;
            font-size: 16px;
            text-align: center;
            border-bottom: 2px dashed #457b9d;
            padding-bottom: 8px;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        li {
            font-size: 13px;
            padding: 8px 4px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
            text-align: center;
            font-weight: bold;
            letter-spacing: 0.5px;
            transition: all 0.3s;
        }

        li.found {
            text-decoration: line-through;
            background: #06d6a0;
            color: #0b0c2a;
        }

        button {
            margin-top: 15px;
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            font-family: inherit;
            background: #ef476f;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 0 #b5173c;
        }

        button:active {
            transform: translateY(3px);
            box-shadow: none;
        }

        /* Tampilan Khusus HP (Layar Tegak / Portrait) */
        @media (max-width: 720px) {
            .game-container {
                flex-direction: column;
                align-items: center;
                padding: 12px;
                gap: 12px;
            }

            /* Papan otomatis mengecil pas sesuai lebar layar HP */
            .grid {
                width: calc(100vw - 44px);
                height: calc(100vw - 44px);
                max-width: 380px;
                max-height: 380px;
                gap: 3px;
                padding: 8px;
            }

            .cell {
                font-size: 16px;
                border-radius: 5px;
            }

            .word-list-box {
                width: 100%;
                max-width: 380px;
                padding: 12px;
            }

            ul {
                grid-template-columns: repeat(2, 1fr);
                gap: 6px;
            }

            li {
                font-size: 12px;
                padding: 7px 4px;
            }
        }
    </style>
</head>
<body>

    <h1>🚀 Petualangan Tata Surya 🌟</h1>
    <p>Sentuh dan geser jarimu untuk menemukan nama planet!</p>

    <div id="message"></div>

    <div class="game-container">
        <div class="grid" id="grid"></div>

        <div class="word-list-box">
            <div>
                <h2>Daftar Kata</h2>
                <ul id="word-list"></ul>
            </div>
            <button onclick="initGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        const allWords = [
            "MERKURIUS", "VENUS", "BUMI", "MARS", 
            "JUPITER", "SATURNUS", "URANUS", "NEPTUNUS", 
            "MATAHARI", "BULAN", "BINTANG", "KOMET", "ASTEROID", "ORBIT"
        ];
        
        const gridSize = 10;
        let grid = [];
        let targetWords = [];
        let foundWords = [];
        
        let isSelecting = false;
        let selectedCells = [];
        let startCell = null;

        const gridElement = document.getElementById('grid');
        const wordListElement = document.getElementById('word-list');
        const messageElement = document.getElementById('message');

        function initGame() {
            grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
            foundWords = [];
            messageElement.textContent = '';
            
            targetWords = [...allWords].sort(() => 0.5 - Math.random()).slice(0, 8);
            
            placeWords();
            fillEmptyCells();
            renderGrid();
            renderWordList();
        }

        function placeWords() {
            const directions = [
                [0, 1],   // Kanan
                [1, 0],   // Bawah
                [1, 1],   // Diagonal kanan bawah
                [-1, 1]   // Diagonal kanan atas
            ];

            for (let word of targetWords) {
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 100) {
                    attempts++;
                    const dir = directions[Math.floor(Math.random() * directions.length)];
                    const row = Math.floor(Math.random() * gridSize);
                    const col = Math.floor(Math.random() * gridSize);

                    if (canPlaceWord(word, row, col, dir)) {
                        for (let i = 0; i < word.length; i++) {
                            grid[row + i * dir[0]][col + i * dir[1]] = word[i];
                        }
                        placed = true;
                    }
                }
            }
        }

        function canPlaceWord(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const newRow = row + i * dir[0];
                const newCol = col + i * dir[1];

                if (newRow < 0 || newRow >= gridSize || newCol < 0 || newCol >= gridSize) {
                    return false;
                }
                if (grid[newRow][newCol] !== '' && grid[newRow][newCol] !== word[i]) {
                    return false;
                }
            }
            return true;
        }

        function fillEmptyCells() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
        }

        function renderGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.textContent = grid[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    // Dukungan Mouse (Laptop/PC)
                    cell.addEventListener('mousedown', () => startSelection(r, c));
                    cell.addEventListener('mouseenter', () => updateSelection(r, c));

                    // Dukungan Sentuhan Jari (HP/Tablet)
                    cell.addEventListener('touchstart', (e) => {
                        e.preventDefault(); // Mencegah klik ganda / zoom
                        startSelection(r, c);
                    }, { passive: false });
                    
                    gridElement.appendChild(cell);
                }
            }
        }

        // Mendeteksi pergerakan jari di atas papan HP
        gridElement.addEventListener('touchmove', (e) => {
            if (!isSelecting) return;
            e.preventDefault(); // Kunci layar agar tidak ikut scroll

            const touch = e.touches[0];
            // Cari elemen kotak huruf tepat di bawah posisi ujung jari saat ini
            const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (targetEl && targetEl.classList.contains('cell')) {
                const r = parseInt(targetEl.dataset.row);
                const c = parseInt(targetEl.dataset.col);
                updateSelection(r, c);
            }
        }, { passive: false });

        // Akhiri seleksi saat jari diangkat atau klik mouse dilepas
        window.addEventListener('mouseup', endSelection);
        window.addEventListener('touchend', endSelection);

        function renderWordList() {
            wordListElement.innerHTML = '';
            for (let word of targetWords) {
                const li = document.createElement('li');
                li.textContent = word;
                li.id = `word-${word}`;
                wordListElement.appendChild(li);
            }
        }

        function startSelection(r, c) {
            isSelecting = true;
            startCell = { r, c };
            updateSelection(r, c);
        }

        function updateSelection(endR, endC) {
            if (!isSelecting) return;

            document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
            selectedCells = [];

            const dR = endR - startCell.r;
            const dC = endC - startCell.c;

            if (dR === 0 || dC === 0 || Math.abs(dR) === Math.abs(dC)) {
                const steps = Math.max(Math.abs(dR), Math.abs(dC));
                const stepR = dR === 0 ? 0 : dR / steps;
                const stepC = dC === 0 ? 0 : dC / steps;

                for (let i = 0; i <= steps; i++) {
                    const currR = startCell.r + i * stepR;
                    const currC = startCell.c + i * stepC;
                    const cellEl = document.querySelector(`.cell[data-row='${currR}'][data-col='${currC}']`);
                    
                    if (cellEl) {
                        cellEl.classList.add('selected');
                        selectedCells.push({ r: currR, c: currC, el: cellEl, letter: grid[currR][currC] });
                    }
                }
            }
        }

        function endSelection() {
            if (!isSelecting) return;
            isSelecting = false;

            const formedWord = selectedCells.map(c => c.letter).join('');
            const reversedWord = formedWord.split('').reverse().join('');

            let matchedWord = null;
            if (targetWords.includes(formedWord) && !foundWords.includes(formedWord)) {
                matchedWord = formedWord;
            } else if (targetWords.includes(reversedWord) && !foundWords.includes(reversedWord)) {
                matchedWord = reversedWord;
            }

            if (matchedWord) {
                foundWords.push(matchedWord);
                selectedCells.forEach(c => {
                    c.el.classList.remove('selected');
                    c.el.classList.add('found');
                });
                document.getElementById(`word-${matchedWord}`).classList.add('found');

                if (foundWords.length === targetWords.length) {
                    messageElement.textContent = "🎉 Hebat! Semua kata ketemu! 🎉";
                }
            } else {
                document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
            }
            selectedCells = [];
        }

        initGame();
    </script>
</body>
</html>
