<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cari Kata: Tata Surya</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #0b0c2a;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: 6px;
        }

        .game-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1d3557;
            padding: 7px 10px;
            border-radius: 10px;
            border: 2px solid #457b9d;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            color: #ffd166;
            margin: 0;
            font-size: 16px;
            font-weight: 800;
        }

        .badge-score {
            background: #06d6a0;
            color: #0b0c2a;
            font-size: 12px;
            font-weight: 900;
            padding: 2px 9px;
            border-radius: 20px;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        button.icon-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button.sound-btn {
            background: #3a86ff;
            box-shadow: 0 2px 0 #1d4ed8;
        }

        button.reset-btn {
            background: #ef476f;
            box-shadow: 0 2px 0 #b5173c;
        }

        button.icon-btn:active {
            transform: translateY(2px);
            box-shadow: none;
        }

        .word-list-box {
            width: 100%;
            background: #162642;
            padding: 6px;
            border-radius: 10px;
            border: 2px solid #457b9d;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        li {
            font-size: 11px;
            padding: 5px 2px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.14);
            text-align: center;
            font-weight: 800;
            letter-spacing: 0.2px;
            transition: all 0.2s;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        li.found {
            text-decoration: line-through;
            background: #06d6a0;
            color: #0b0c2a;
        }

        /* Papan Persegi Penuh Lebar Layar HP */
        .grid {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 3px;
            background: #1d3557;
            padding: 6px;
            border-radius: 12px;
            border: 3px solid #457b9d;
            touch-action: none;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.45);
        }

        .cell {
            background: #f1faee;
            color: #1d3557;
            font-size: clamp(19px, 5.5vw, 28px);
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            pointer-events: none;
            line-height: 1;
            box-shadow: 0 2px 0 rgba(0, 0, 0, 0.15);
            transition: background-color 0.1s, transform 0.1s;
        }

        .cell.selected {
            background: #ffd166;
            color: #0b0c2a;
            transform: scale(1.06);
            z-index: 2;
        }

        .cell.found {
            background: #06d6a0;
            color: #0b0c2a;
            animation: pop 0.25s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.14); }
            100% { transform: scale(1); }
        }

        .win-banner {
            position: fixed;
            inset: 0;
            background: rgba(11, 12, 42, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        .win-banner.show {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        .win-card {
            background: #1d3557;
            border: 3px solid #ffd166;
            border-radius: 20px;
            padding: 24px 28px;
            max-width: 320px;
            width: 100%;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.6);
        }

        .win-card h2 {
            color: #ffd166;
            margin: 0 0 8px 0;
            font-size: 24px;
        }

        .win-card p {
            color: #f1faee;
            margin: 0 0 18px 0;
            font-size: 14px;
        }

        .win-card button {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            background: #06d6a0;
            color: #0b0c2a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            box-shadow: 0 4px 0 #049a73;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-bar">
            <div class="title-group">
                <h1>🚀 Tata Surya</h1>
                <span class="badge-score" id="score-badge">0 / 8</span>
            </div>
            <div class="btn-group">
                <button class="icon-btn sound-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="icon-btn reset-btn" onclick="initGame()">Ulang 🔄</button>
            </div>
        </div>

        <div class="word-list-box">
            <ul id="word-list"></ul>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div class="win-banner" id="win-banner">
        <div class="win-card">
            <h2>🎉 Hebat! 🎉</h2>
            <p>Kamu berhasil menemukan semua kata Tata Surya!</p>
            <button onclick="initGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        const allWords = [
            "MERKURIUS", "VENUS", "BUMI", "MARS",
            "JUPITER", "SATURNUS", "URANUS", "NEPTUNUS",
            "MATAHARI", "BULAN", "BINTANG", "KOMET", "ASTEROID", "ORBIT"
        ];

        const gridSize = 10;
        let grid = [];
        let targetWords = [];
        let foundWords = [];
        let soundEnabled = true;
        let audioCtx = null;

        let isSelecting = false;
        let selectedCells = [];
        let startCell = null;

        const gridElement = document.getElementById('grid');
        const wordListElement = document.getElementById('word-list');
        const scoreBadge = document.getElementById('score-badge');
        const soundBtn = document.getElementById('sound-btn');
        const winBanner = document.getElementById('win-banner');

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (AudioContextClass) {
                    audioCtx = new AudioContextClass();
                }
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playTone(freq, duration, delay = 0, type = 'sine', volume = 0.2) {
            if (!soundEnabled) return;
            const ctx = getAudioContext();
            if (!ctx) return;

            const startTime = ctx.currentTime + delay;
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();

            osc.type = type;
            osc.frequency.setValueAtTime(freq, startTime);

            gain.gain.setValueAtTime(0.001, startTime);
            gain.gain.exponentialRampToValueAtTime(volume, startTime + 0.015);
            gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

            osc.connect(gain);
            gain.connect(ctx.destination);

            osc.start(startTime);
            osc.stop(startTime + duration + 0.02);
        }

        function playCorrectSound() {
            playTone(523.25, 0.14, 0, 'triangle', 0.22);
            playTone(659.25, 0.14, 0.11, 'triangle', 0.22);
            playTone(783.99, 0.22, 0.22, 'triangle', 0.24);
        }

        function playWrongSound() {
            playTone(220, 0.16, 0, 'sawtooth', 0.12);
            playTone(174.61, 0.22, 0.12, 'sawtooth', 0.12);
        }

        function playWinSound() {
            playTone(523.25, 0.14, 0, 'triangle', 0.24);
            playTone(659.25, 0.14, 0.12, 'triangle', 0.24);
            playTone(783.99, 0.14, 0.24, 'triangle', 0.24);
            playTone(1046.5, 0.35, 0.36, 'triangle', 0.26);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? '🔊' : '🔇';
            if (soundEnabled) {
                getAudioContext();
                playTone(587.33, 0.1, 0, 'sine', 0.15);
            }
        }

        function initGame() {
            grid = Array(gridSize).fill(null).map(() => Array(gridSize).fill(''));
            foundWords = [];
            winBanner.classList.remove('show');
            scoreBadge.textContent = `0 / 8`;

            targetWords = [...allWords].sort(() => 0.5 - Math.random()).slice(0, 8);

            placeWords();
            fillEmptyCells();
            renderGrid();
            renderWordList();
        }

        function placeWords() {
            const directions = [
                [0, 1],
                [1, 0],
                [1, 1],
                [-1, 1]
            ];

            for (let word of targetWords) {
                let placed = false;
                let attempts = 0;

                while (!placed && attempts < 100) {
                    attempts++;
                    const dir = directions[Math.floor(Math.random() * directions.length)];
                    const row = Math.floor(Math.random() * gridSize);
                    const col = Math.floor(Math.random() * gridSize);

                    if (canPlaceWord(word, row, col, dir)) {
                        for (let i = 0; i < word.length; i++) {
                            grid[row + i * dir[0]][col + i * dir[1]] = word[i];
                        }
                        placed = true;
                    }
                }
            }
        }

        function canPlaceWord(word, row, col, dir) {
            for (let i = 0; i < word.length; i++) {
                const newRow = row + i * dir[0];
                const newCol = col + i * dir[1];

                if (newRow < 0 || newRow >= gridSize || newCol < 0 || newCol >= gridSize) {
                    return false;
                }
                if (grid[newRow][newCol] !== '' && grid[newRow][newCol] !== word[i]) {
                    return false;
                }
            }
            return true;
        }

        function fillEmptyCells() {
            const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    if (grid[r][c] === '') {
                        grid[r][c] = letters[Math.floor(Math.random() * letters.length)];
                    }
                }
            }
        }

        function renderGrid() {
            gridElement.innerHTML = '';
            for (let r = 0; r < gridSize; r++) {
                for (let c = 0; c < gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.classList.add('cell');
                    cell.textContent = grid[r][c];
                    cell.dataset.row = r;
                    cell.dataset.col = c;
                    gridElement.appendChild(cell);
                }
            }
        }

        function getCellFromCoords(clientX, clientY) {
            const rect = gridElement.getBoundingClientRect();
            const x = clientX - rect.left;
            const y = clientY - rect.top;

            if (x < 0 || y < 0 || x > rect.width || y > rect.height) return null;

            const col = Math.floor((x / rect.width) * gridSize);
            const row = Math.floor((y / rect.height) * gridSize);

            if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
                return { r: row, c: col };
            }
            return null;
        }

        gridElement.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            getAudioContext();
            const cell = getCellFromCoords(e.clientX, e.clientY);
            if (cell) {
                isSelecting = true;
                startCell = cell;
                updateSelection(cell.r, cell.c);
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!isSelecting) return;
            const cell = getCellFromCoords(e.clientX, e.clientY);
            if (cell) {
                updateSelection(cell.r, cell.c);
            }
        });

        window.addEventListener('pointerup', () => {
            if (isSelecting) {
                endSelection();
            }
        });

        window.addEventListener('pointercancel', () => {
            if (isSelecting) {
                endSelection();
            }
        });

        function renderWordList() {
            wordListElement.innerHTML = '';
            for (let word of targetWords) {
                const li = document.createElement('li');
                li.textContent = word;
                li.id = `word-${word}`;
                wordListElement.appendChild(li);
            }
        }

        function updateSelection(endR, endC) {
            document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
            selectedCells = [];

            const dR = endR - startCell.r;
            const dC = endC - startCell.c;

            if (dR === 0 || dC === 0 || Math.abs(dR) === Math.abs(dC)) {
                const steps = Math.max(Math.abs(dR), Math.abs(dC));
                const stepR = dR === 0 ? 0 : dR / steps;
                const stepC = dC === 0 ? 0 : dC / steps;

                for (let i = 0; i <= steps; i++) {
                    const currR = startCell.r + i * stepR;
                    const currC = startCell.c + i * stepC;
                    const cellEl = document.querySelector(`.cell[data-row='${currR}'][data-col='${currC}']`);

                    if (cellEl) {
                        cellEl.classList.add('selected');
                        selectedCells.push({ r: currR, c: currC, el: cellEl, letter: grid[currR][currC] });
                    }
                }
            }
        }

        function endSelection() {
            isSelecting = false;

            const formedWord = selectedCells.map(c => c.letter).join('');
            const reversedWord = formedWord.split('').reverse().join('');

            let matchedWord = null;
            if (targetWords.includes(formedWord) && !foundWords.includes(formedWord)) {
                matchedWord = formedWord;
            } else if (targetWords.includes(reversedWord) && !foundWords.includes(reversedWord)) {
                matchedWord = reversedWord;
            }

            if (matchedWord) {
                foundWords.push(matchedWord);
                selectedCells.forEach(c => {
                    c.el.classList.remove('selected');
                    c.el.classList.add('found');
                });
                document.getElementById(`word-${matchedWord}`).classList.add('found');
                scoreBadge.textContent = `${foundWords.length} / ${targetWords.length}`;

                if (foundWords.length === targetWords.length) {
                    playWinSound();
                    setTimeout(() => winBanner.classList.add('show'), 350);
                } else {
                    playCorrectSound();
                }
            } else {
                if (selectedCells.length > 1) {
                    playWrongSound();
                }
                document.querySelectorAll('.cell.selected').forEach(el => el.classList.remove('selected'));
            }
            selectedCells = [];
        }

        initGame();
    </script>
</body>
</html>
