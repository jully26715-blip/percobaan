<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Materi - Tata Surya</title>
    <link rel="stylesheet" href="materi.css">
    <style>
        .tile-icon-img {
            width: 68px;
            height: 68px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid rgba(165, 180, 252, 0.45);
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="stars2"></div>
    <div class="nebula-glow"></div>
    <div class="planet-ornamen"></div>

    <div class="materi-grid">
        <a href="pengenalan.html" class="tile-btn pengenalan">
            <img src="icon-pengenalan.jpg" alt="Ikon Pengenalan Tata Surya" class="tile-icon-img">
            <span class="tile-title">Pengenalan Tata Surya</span>
            <span class="tile-desc">Pusat tata surya &amp; energi</span>
        </a>

        <a href="tatasurya.html" class="tile-btn tile-planet">
            <img src="icon-planet.jpg" alt="Ikon Delapan Planet" class="tile-icon-img">
            <span class="tile-title">Delapan Planet</span>
            <span class="tile-desc">Urutan &amp; ciri khas planet</span>
        </a>

        <a href="materi-rotasi-revolusi.html" class="tile-btn tile-earth">
            <img src="icon-rotasi.jpg" alt="Ikon Rotasi dan Revolusi" class="tile-icon-img">
            <span class="tile-title">Rotasi &amp; Revolusi</span>
            <span class="tile-desc">Gerak Bumi &amp; dampaknya</span>
        </a>

        <a href="materi-benda-langit.html" class="tile-btn tile-comet">
            <img src="icon-benda-langit.jpg" alt="Ikon Benda Langit Lain" class="tile-icon-img">
            <span class="tile-title">Benda Langit Lain</span>
            <span class="tile-desc">Satelit, asteroid &amp; komet</span>
        </a>
    </div>
</body>
</html>
