<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ujian Semester Ganjil (15 Soal)</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 28px 16px;
      background: #f1f5f9;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #0f172a;
    }

    .container {
      max-width: 820px;
      margin: 0 auto;
      display: grid;
      gap: 18px;
    }

    .card {
      background: #ffffff;
      padding: 22px 24px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 6px 20px rgba(15, 23, 42, 0.05);
    }

    h1 { margin: 0 0 6px; font-size: 1.4rem; }
    .muted { margin: 0; color: #64748b; font-size: 0.9rem; }

    .nama-box {
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: 340px;
    }

    label { font-size: 0.85rem; font-weight: 600; }

    input[type="text"] {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      font-size: 0.92rem;
      font-family: inherit;
    }

    .question-item {
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 14px;
      background: #f8fafc;
    }

    .question-meta {
      font-size: 0.78rem;
      font-weight: 700;
      color: #2563eb;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .question-text { font-weight: 600; margin-bottom: 10px; }

    .option-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 6px 0;
      font-size: 0.92rem;
      cursor: pointer;
    }

    button {
      padding: 12px 20px;
      border-radius: 8px;
      background: #2563eb;
      color: #fff;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    button:hover { background: #1d4ed8; }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h1>Ujian Semester Ganjil (15 Soal)</h1>
      <p class="muted">Isi nama peserta dan jawab seluruh soal. Setelah dikirim, hasil ujian otomatis tampil di halaman grafik.</p>

      <div class="nama-box">
        <label for="namaPeserta">Nama Peserta</label>
        <input id="namaPeserta" type="text" placeholder="Masukkan nama peserta" required />
      </div>
    </div>

    <form id="examForm" class="card">
      <div id="questionsContainer"></div>
      <button type="submit">Kirim Jawaban</button>
    </form>
  </div>

  <script>
    const HALAMAN_GRAFIK = "grafik1.html";
    const STORAGE_KEY = "rekap_nilai_ujian";

    // 15 Soal Semester Ganjil (3 soal per mata pelajaran)
    const soalGanjil = [
      { id: 1, mapel: "Matematika", tanya: "1. Hasil dari 15 + 5 x 2 adalah...", pilihan: ["40", "25", "30", "20"], jawabanBenar: 1 },
      { id: 2, mapel: "Matematika", tanya: "2. Akar kuadrat dari 81 adalah...", pilihan: ["7", "8", "9", "10"], jawabanBenar: 2 },
      { id: 3, mapel: "Matematika", tanya: "3. Nilai dari 3 pangkat 3 adalah...", pilihan: ["9", "18", "27", "81"], jawabanBenar: 2 },

      { id: 4, mapel: "B. Indonesia", tanya: "4. Ide pokok dalam suatu paragraf disebut juga...", pilihan: ["Gagasan utama", "Kalimat penjelas", "Kesimpulan", "Sinopsis"], jawabanBenar: 0 },
      { id: 5, mapel: "B. Indonesia", tanya: "5. Antonim dari kata 'hemat' adalah...", pilihan: ["Cermat", "Boros", "Irit", "Kikir"], jawabanBenar: 1 },
      { id: 6, mapel: "B. Indonesia", tanya: "6. Kalimat yang berisi perintah atau ajakan disebut...", pilihan: ["Kalimat berita", "Kalimat tanya", "Kalimat imperatif", "Kalimat pasif"], jawabanBenar: 2 },

      { id: 7, mapel: "B. Inggris", tanya: "7. The past tense of 'go' is...", pilihan: ["Goed", "Gone", "Went", "Going"], jawabanBenar: 2 },
      { id: 8, mapel: "B. Inggris", tanya: "8. 'She ___ a book every morning.'", pilihan: ["read", "reads", "reading", "is read"], jawabanBenar: 1 },
      { id: 9, mapel: "B. Inggris", tanya: "9. 'We ___ to school yesterday.'", pilihan: ["walk", "walks", "walking", "walked"], jawabanBenar: 3 },

      { id: 10, mapel: "IPA / Fisika", tanya: "10. Satuan SI untuk gaya adalah...", pilihan: ["Watt", "Joule", "Newton", "Pascal"], jawabanBenar: 2 },
      { id: 11, mapel: "IPA / Fisika", tanya: "11. Alat untuk mengukur suhu disebut...", pilihan: ["Barometer", "Termometer", "Higrometer", "Anemometer"], jawabanBenar: 1 },
      { id: 12, mapel: "IPA / Fisika", tanya: "12. Planet terdekat dengan Matahari adalah...", pilihan: ["Venus", "Mars", "Merkurius", "Bumi"], jawabanBenar: 2 },

      { id: 13, mapel: "Informatika", tanya: "13. Perangkat keras untuk menampilkan gambar adalah...", pilihan: ["Keyboard", "Mouse", "Monitor", "Scanner"], jawabanBenar: 2 },
      { id: 14, mapel: "Informatika", tanya: "14. Sistem bilangan biner terdiri atas angka...", pilihan: ["0 dan 1", "1 sampai 9", "0 sampai 7", "0 sampai 9"], jawabanBenar: 0 },
      { id: 15, mapel: "Informatika", tanya: "15. Tombol pintas untuk menyalin teks adalah...", pilihan: ["Ctrl + V", "Ctrl + X", "Ctrl + C", "Ctrl + Z"], jawabanBenar: 2 }
    ];

    const questionsContainer = document.getElementById("questionsContainer");
    questionsContainer.innerHTML = soalGanjil.map((q) => {
      const optionsHtml = q.pilihan.map((opt, idx) => `
        <label class="option-row">
          <input type="radio" name="soal_${q.id}" value="${idx}" required />
          <span>${opt}</span>
        </label>
      `).join("");

      return `
        <div class="question-item">
          <div class="question-meta">${q.mapel} • Semester Ganjil</div>
          <div class="question-text">${q.tanya}</div>
          ${optionsHtml}
        </div>
      `;
    }).join("");

    document.getElementById("examForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const nama = document.getElementById("namaPeserta").value.trim();
      if (!nama) {
        alert("Masukkan nama peserta terlebih dahulu.");
        return;
      }

      const stats = {};
      let totalBenar = 0;

      soalGanjil.forEach((q) => {
        if (!stats[q.mapel]) stats[q.mapel] = { benar: 0, total: 0 };
        stats[q.mapel].total++;

        const checked = document.querySelector(`input[name="soal_${q.id}"]:checked`);
        if (checked && Number(checked.value) === q.jawabanBenar) {
          stats[q.mapel].benar++;
          totalBenar++;
        }
      });

      const nilaiPerMapel = {};
      Object.entries(stats).forEach(([mapel, s]) => {
        nilaiPerMapel[mapel] = Number(((s.benar / s.total) * 100).toFixed(1));
      });

      const nilaiAkhir = Number(((totalBenar / soalGanjil.length) * 100).toFixed(1));

      const rekap = JSON.parse(localStorage.getItem(STORAGE_KEY) || "{}");
      const keyPeserta = nama.toLowerCase();
      if (!rekap[keyPeserta]) {
        rekap[keyPeserta] = { nama, ganjil: {}, genap: {} };
      }
      rekap[keyPeserta].nama = nama;
      rekap[keyPeserta].ganjil = nilaiPerMapel;
      rekap[keyPeserta].ringkasanGanjil = { totalBenar, totalSoal: soalGanjil.length, nilaiAkhir };
      rekap.pesertaAktif = keyPeserta;
      rekap.semesterTerakhir = "ganjil";

      localStorage.setItem(STORAGE_KEY, JSON.stringify(rekap));
      window.location.href = "grafik1.html";
    });
  </script>
</body>
</html>
