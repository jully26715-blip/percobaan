<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Game Cari Kata: Tata Surya</title>
    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #080d1a;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #f4f7fb;
        }

        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 6px;
            overflow-x: hidden;
            background-image:
                radial-gradient(1px 1px at 14% 16%, rgba(255, 255, 255, 0.65), transparent),
                radial-gradient(1.5px 1.5px at 32% 28%, rgba(255, 255, 255, 0.45), transparent),
                radial-gradient(1px 1px at 54% 12%, rgba(255, 255, 255, 0.7), transparent),
                radial-gradient(1.5px 1.5px at 76% 22%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1px 1px at 89% 38%, rgba(255, 255, 255, 0.6), transparent),
                radial-gradient(1px 1px at 18% 68%, rgba(255, 255, 255, 0.45), transparent),
                radial-gradient(1.5px 1.5px at 42% 82%, rgba(255, 255, 255, 0.5), transparent),
                radial-gradient(1px 1px at 68% 76%, rgba(255, 255, 255, 0.4), transparent),
                radial-gradient(1.5px 1.5px at 85% 86%, rgba(255, 255, 255, 0.55), transparent),
                linear-gradient(180deg, #080d1a 0%, #0e172a 55%, #142038 100%);
        }

        .game-wrapper {
            width: 100%;
            max-width: 520px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .header-bar {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #182744;
            padding: 7px 10px;
            border-radius: 10px;
            border: 1.5px solid #334e7a;
        }

        .title-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        h1 {
            color: #f6c968;
            margin: 0;
            font-size: 16px;
            font-weight: 800;
        }

        .badge-score {
            background: #2ec4b6;
            color: #080d1a;
            font-size: 12px;
            font-weight: 900;
            padding: 2px 9px;
            border-radius: 20px;
        }

        .btn-group {
            display: flex;
            gap: 5px;
        }

        button.icon-btn {
            padding: 5px 10px;
            font-size: 12px;
            font-weight: bold;
            font-family: inherit;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button.sound-btn {
            background: #2b6cb0;
        }

        button.reset-btn {
            background: #c53030;
        }

        .word-list-box {
            width: 100%;
            background: #121f38;
            padding: 6px;
            border-radius: 10px;
            border: 1.5px solid #334e7a;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
        }

        li {
            font-size: 11px;
            padding: 5px 2px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.08);
            text-align: center;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        li.found {
            text-decoration: line-through;
            background: #2ec4b6;
            color: #080d1a;
        }

        .grid {
            width: 100%;
            aspect-ratio: 1 / 1;
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            grid-template-rows: repeat(10, 1fr);
            gap: 3px;
            background: #182744;
            padding: 6px;
            border-radius: 12px;
            border: 2px solid #334e7a;
            touch-action: none;
        }

        .cell {
            background: #f4f7fb;
            color: #10203a;
            font-size: 20px;
            font-weight: 900;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 6px;
            pointer-events: none;
            line-height: 1;
        }

        .cell.selected {
            background: #f6c968;
            color: #080d1a;
        }

        .cell.found {
            background: #2ec4b6;
            color: #080d1a;
        }

        .win-banner {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(8, 13, 26, 0.88);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            padding: 20px;
            text-align: center;
        }

        .win-banner.show {
            display: flex;
        }

        .win-card {
            background: #182744;
            border: 2px solid #f6c968;
            border-radius: 18px;
            padding: 24px;
            max-width: 320px;
            width: 100%;
        }

        .win-card h2 {
            color: #f6c968;
            margin: 0 0 8px 0;
            font-size: 22px;
        }

        .win-card p {
            color: #f4f7fb;
            margin: 0 0 16px 0;
            font-size: 14px;
        }

        .win-card button {
            width: 100%;
            padding: 12px;
            font-size: 15px;
            font-weight: bold;
            background: #2ec4b6;
            color: #080d1a;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="game-wrapper">
        <div class="header-bar">
            <div class="title-group">
                <h1>🚀 Tata Surya</h1>
                <span class="badge-score" id="score-badge">0 / 8</span>
            </div>
            <div class="btn-group">
                <button class="icon-btn sound-btn" id="sound-btn" onclick="toggleSound()">🔊</button>
                <button class="icon-btn reset-btn" onclick="initGame()">Ulang 🔄</button>
            </div>
        </div>

        <div class="word-list-box">
            <ul id="word-list"></ul>
        </div>

        <div class="grid" id="grid"></div>
    </div>

    <div class="win-banner" id="win-banner">
        <div class="win-card">
            <h2>🎉 Hebat! 🎉</h2>
            <p>Kamu berhasil menemukan semua kata Tata Surya!</p>
            <button onclick="initGame()">Main Lagi 🔄</button>
        </div>
    </div>

    <script>
        var allWords = [
            "MERKURIUS", "VENUS", "BUMI", "MARS",
            "JUPITER", "SATURNUS", "URANUS", "NEPTUNUS",
            "MATAHARI", "BULAN", "BINTANG", "KOMET", "ASTEROID", "ORBIT"
        ];

        var gridSize = 10;
        var grid = [];
        var targetWords = [];
        var foundWords = [];
        var soundEnabled = true;
        var audioCtx = null;

        var isSelecting = false;
        var selectedCells = [];
        var startCell = null;

        var gridElement = document.getElementById("grid");
        var wordListElement = document.getElementById("word-list");
        var scoreBadge = document.getElementById("score-badge");
        var soundBtn = document.getElementById("sound-btn");
        var winBanner = document.getElementById("win-banner");

        function getAudioContext() {
            try {
                if (!audioCtx) {
                    var AC = window.AudioContext || window.webkitAudioContext;
                    if (AC) {
                        audioCtx = new AC();
                    }
                }
                if (audioCtx && audioCtx.state === "suspended") {
                    audioCtx.resume();
                }
                return audioCtx;
            } catch (err) {
                return null;
            }
        }

        function playTone(freq, duration, delay, type, volume) {
            if (!soundEnabled) return;
            try {
                var ctx = getAudioContext();
                if (!ctx) return;

                var startTime = ctx.currentTime + (delay || 0);
                var osc = ctx.createOscillator();
                var gain = ctx.createGain();

                osc.type = type || "sine";
                osc.frequency.setValueAtTime(freq, startTime);

                gain.gain.setValueAtTime(0.001, startTime);
                gain.gain.exponentialRampToValueAtTime(volume || 0.2, startTime + 0.015);
                gain.gain.exponentialRampToValueAtTime(0.001, startTime + duration);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(startTime);
                osc.stop(startTime + duration + 0.02);
            } catch (err) {
                // Abaikan jika browser memblokir audio
            }
        }

        function playCorrectSound() {
            playTone(523.25, 0.14, 0, "triangle", 0.22);
            playTone(659.25, 0.14, 0.11, "triangle", 0.22);
            playTone(783.99, 0.22, 0.22, "triangle", 0.24);
        }

        function playWrongSound() {
            playTone(220, 0.16, 0, "sawtooth", 0.12);
            playTone(174.61, 0.22, 0.12, "sawtooth", 0.12);
        }

        function playWinSound() {
            playTone(523.25, 0.14, 0, "triangle", 0.24);
            playTone(659.25, 0.14, 0.12, "triangle", 0.24);
            playTone(783.99, 0.14, 0.24, "triangle", 0.24);
            playTone(1046.5, 0.35, 0.36, "triangle", 0.26);
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            soundBtn.textContent = soundEnabled ? "🔊" : "🔇";
            if (soundEnabled) {
                getAudioContext();
                playTone(587.33, 0.1, 0, "sine", 0.15);
            }
        }

        function initGame() {
            grid = [];
            for (var r = 0; r < gridSize; r++) {
                var rowArr = [];
                for (var c = 0; c < gridSize; c++) {
                    rowArr.push("");
                }
                grid.push(rowArr);
            }

            foundWords = [];
            winBanner.className = "win-banner";
            scoreBadge.textContent = "0 / 8";

            var shuffled = allWords.slice().sort(function () {
                return 0.5 - Math.random();
            });
            targetWords = shuffled.slice(0, 8);

            placeWords();
            fillEmptyCells();
            renderGrid();
            renderWordList();
        }

        function placeWords() {
            var directions = [
                [0, 1],
                [1, 0],
                [1, 1],
                [-1, 1]
            ];

            for (var w = 0; w < targetWords.length; w++) {
                var word = targetWords[w];
                var placed = false;
                var attempts = 0;

                while (!placed && attempts < 100) {
                    attempts++;
                    var dir = directions[Math.floor(Math.random() * directions.length)];
                    var row = Math.floor(Math.random() * gridSize);
                    var col = Math.floor(Math.random() * gridSize);

                    if (canPlaceWord(word, row, col, dir)) {
                        for (var i = 0; i < word.length; i++) {
                            grid[row + i * dir[0]][col + i * dir[1]] = word.charAt(i);
                        }
                        placed = true;
                    }
                }
            }
        }

        function canPlaceWord(word, row, col, dir) {
            for (var i = 0; i < word.length; i++) {
                var newRow = row + i * dir[0];
                var newCol = col + i * dir[1];

                if (newRow < 0 || newRow >= gridSize || newCol < 0 || newCol >= gridSize) {
                    return false;
                }
                if (grid[newRow][newCol] !== "" && grid[newRow][newCol] !== word.charAt(i)) {
                    return false;
                }
            }
            return true;
        }

        function fillEmptyCells() {
            var letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
            for (var r = 0; r < gridSize; r++) {
                for (var c = 0; c < gridSize; c++) {
                    if (grid[r][c] === "") {
                        grid[r][c] = letters.charAt(Math.floor(Math.random() * letters.length));
                    }
                }
            }
        }

        function renderGrid() {
            gridElement.innerHTML = "";
            for (var r = 0; r < gridSize; r++) {
                for (var c = 0; c < gridSize; c++) {
                    var cell = document.createElement("div");
                    cell.className = "cell";
                    cell.textContent = grid[r][c];
                    cell.setAttribute("data-row", r);
                    cell.setAttribute("data-col", c);
                    gridElement.appendChild(cell);
                }
            }
        }

        function getCellFromCoords(clientX, clientY) {
            var rect = gridElement.getBoundingClientRect();
            var x = clientX - rect.left;
            var y = clientY - rect.top;

            if (x < 0 || y < 0 || x > rect.width || y > rect.height) {
                return null;
            }

            var col = Math.floor((x / rect.width) * gridSize);
            var row = Math.floor((y / rect.height) * gridSize);

            if (row >= 0 && row < gridSize && col >= 0 && col < gridSize) {
                return { r: row, c: col };
            }
            return null;
        }

        function handleStart(clientX, clientY) {
            getAudioContext();
            var cell = getCellFromCoords(clientX, clientY);
            if (cell) {
                isSelecting = true;
                startCell = cell;
                updateSelection(cell.r, cell.c);
            }
        }

        function handleMove(clientX, clientY) {
            if (!isSelecting) return;
            var cell = getCellFromCoords(clientX, clientY);
            if (cell) {
                updateSelection(cell.r, cell.c);
            }
        }

        function handleEnd() {
            if (!isSelecting) return;
            endSelection();
        }

        if (window.PointerEvent) {
            gridElement.addEventListener("pointerdown", function (e) {
                e.preventDefault();
                handleStart(e.clientX, e.clientY);
            });
            window.addEventListener("pointermove", function (e) {
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener("pointerup", handleEnd);
            window.addEventListener("pointercancel", handleEnd);
        } else {
            gridElement.addEventListener("touchstart", function (e) {
                e.preventDefault();
                if (e.touches && e.touches[0]) {
                    handleStart(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });
            window.addEventListener("touchmove", function (e) {
                if (e.touches && e.touches[0]) {
                    handleMove(e.touches[0].clientX, e.touches[0].clientY);
                }
            }, { passive: false });
            window.addEventListener("touchend", handleEnd);

            gridElement.addEventListener("mousedown", function (e) {
                handleStart(e.clientX, e.clientY);
            });
            window.addEventListener("mousemove", function (e) {
                handleMove(e.clientX, e.clientY);
            });
            window.addEventListener("mouseup", handleEnd);
        }

        function renderWordList() {
            wordListElement.innerHTML = "";
            for (var i = 0; i < targetWords.length; i++) {
                var word = targetWords[i];
                var li = document.createElement("li");
                li.textContent = word;
                li.id = "word-" + word;
                wordListElement.appendChild(li);
            }
        }

        function clearSelected() {
            var allCells = gridElement.querySelectorAll(".cell");
            for (var i = 0; i < allCells.length; i++) {
                if (allCells[i].className.indexOf("found") !== -1) {
                    allCells[i].className = "cell found";
                } else {
                    allCells[i].className = "cell";
                }
            }
        }

        function updateSelection(endR, endC) {
            clearSelected();
            selectedCells = [];

            var dR = endR - startCell.r;
            var dC = endC - startCell.c;

            if (dR === 0 || dC === 0 || Math.abs(dR) === Math.abs(dC)) {
                var steps = Math.max(Math.abs(dR), Math.abs(dC));
                var stepR = dR === 0 ? 0 : dR / steps;
                var stepC = dC === 0 ? 0 : dC / steps;

                for (var i = 0; i <= steps; i++) {
                    var currR = Math.round(startCell.r + i * stepR);
                    var currC = Math.round(startCell.c + i * stepC);
                    var cellEl = gridElement.querySelector('.cell[data-row="' + currR + '"][data-col="' + currC + '"]');

                    if (cellEl) {
                        if (cellEl.className.indexOf("found") === -1) {
                            cellEl.className = "cell selected";
                        }
                        selectedCells.push({
                            r: currR,
                            c: currC,
                            el: cellEl,
                            letter: grid[currR][currC]
                        });
                    }
                }
            }
        }

        function endSelection() {
            isSelecting = false;

            var formedWord = "";
            for (var i = 0; i < selectedCells.length; i++) {
                formedWord += selectedCells[i].letter;
            }
            var reversedWord = formedWord.split("").reverse().join("");

            var matchedWord = null;
            if (targetWords.indexOf(formedWord) !== -1 && foundWords.indexOf(formedWord) === -1) {
                matchedWord = formedWord;
            } else if (targetWords.indexOf(reversedWord) !== -1 && foundWords.indexOf(reversedWord) === -1) {
                matchedWord = reversedWord;
            }

            if (matchedWord) {
                foundWords.push(matchedWord);
                for (var j = 0; j < selectedCells.length; j++) {
                    selectedCells[j].el.className = "cell found";
                }
                var listItem = document.getElementById("word-" + matchedWord);
                if (listItem) {
                    listItem.className = "found";
                }
                scoreBadge.textContent = foundWords.length + " / " + targetWords.length;

                if (foundWords.length === targetWords.length) {
                    playWinSound();
                    setTimeout(function () {
                        winBanner.className = "win-banner show";
                    }, 350);
                } else {
                    playCorrectSound();
                }
            } else {
                if (selectedCells.length > 1) {
                    playWrongSound();
                }
                clearSelected();
            }

            selectedCells = [];
        }

        initGame();
    </script>
</body>
</html>
