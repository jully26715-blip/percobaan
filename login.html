<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- FORM LOGIN -->
    <div class="login-card" id="box-login">
        <h2>Selamat Datang</h2>
        <form onsubmit="cekLogin(event)">
            <div class="input-group">
                <label for="login-user">Username atau Email</label>
                <input type="text" id="login-user" placeholder="Masukkan username atau email" required>
            </div>

            <div class="input-group">
                <label for="login-pass">Kata Sandi</label>
                <input type="password" id="login-pass" placeholder="Masukkan kata sandi" required>
            </div>

            <button type="submit" class="btn-login">Masuk</button>
        </form>

        <div class="extra-links">
            <p>Belum punya akun? <a href="#" onclick="tampilDaftar(event)">Daftar sekarang</a></p>
        </div>
    </div>

    <!-- FORM DAFTAR (Tersembunyi awalnya) -->
    <div class="login-card" id="box-daftar" style="display: none;">
        <h2>Daftar Akun</h2>
        <form onsubmit="simpanAkun(event)">
            <div class="input-group">
                <label for="daftar-nama">Nama Lengkap</label>
                <input type="text" id="daftar-nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="input-group">
                <label for="daftar-user">Username atau Email</label>
                <input type="text" id="daftar-user" placeholder="Buat username atau email" required>
            </div>

            <div class="input-group">
                <label for="daftar-pass">Kata Sandi</label>
                <input type="password" id="daftar-pass" placeholder="Buat kata sandi" required>
            </div>

            <button type="submit" class="btn-login">Daftar Sekarang</button>
        </form>

        <div class="extra-links">
            <p>Sudah punya akun? <a href="#" onclick="tampilLogin(event)">Masuk di sini</a></p>
        </div>
    </div>

    <script>
        function tampilDaftar(e) {
            e.preventDefault();
            document.getElementById('box-login').style.display = 'none';
            document.getElementById('box-daftar').style.display = 'block';
        }

        function tampilLogin(e) {
            e.preventDefault();
            document.getElementById('box-daftar').style.display = 'none';
            document.getElementById('box-login').style.display = 'block';
        }

        function simpanAkun(e) {
            e.preventDefault();
            const nama = document.getElementById('daftar-nama').value.trim();
            const username = document.getElementById('daftar-user').value.trim();
            const password = document.getElementById('daftar-pass').value;

            let daftarAkun = JSON.parse(localStorage.getItem('semua_akun')) || [];
            if (daftarAkun.some(akun => akun.username === username)) {
                alert('Username sudah terdaftar! Silakan langsung masuk.');
                tampilLogin(e);
                return;
            }

            daftarAkun.push({ nama, username, password });
            localStorage.setItem('semua_akun', JSON.stringify(daftarAkun));

            alert('Akun berhasil dibuat! Silakan masuk.');
            tampilLogin(e);
        }

        function cekLogin(e) {
            e.preventDefault();
            const inputUser = document.getElementById('login-user').value.trim();
            const inputPass = document.getElementById('login-pass').value;

            const daftarAkun = JSON.parse(localStorage.getItem('semua_akun')) || [];
            const akunCocok = daftarAkun.find(akun => akun.username === inputUser && akun.password === inputPass);

            if (akunCocok) {
                localStorage.setItem('namaPengguna', akunCocok.nama);
                window.location.href = 'beranda.html';
            } else {
                alert('Username atau kata sandi salah! Pastikan kamu sudah daftar.');
            }
        }
    </script>

</body>
</html>
