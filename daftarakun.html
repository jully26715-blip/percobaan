<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halaman Daftar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-card">
        <h2>Daftar Akun</h2>
        <form onsubmit="simpanAkun(event)">
            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" name="nama" placeholder="Masukkan nama lengkap" required>
            </div>

            <div class="input-group">
                <label for="username">Username atau Email</label>
                <input type="text" id="username" name="username" placeholder="Buat username atau email" required>
            </div>

            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <input type="password" id="password" name="password" placeholder="Buat kata sandi" required>
            </div>

            <button type="submit" class="btn-login">Daftar Sekarang</button>
        </form>

        <div class="extra-links">
            <p>Sudah punya akun? <a href="index.html">Masuk di sini</a></p>
        </div>
    </div>

    <script>
        function simpanAkun(event) {
            if (event) event.preventDefault();
            
            const nama = document.getElementById('nama').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;

            if (!nama || !username || !password) {
                alert('Harap isi semua kolom terlebih dahulu!');
                return;
            }

            // Ambil daftar semua akun yang sudah ada (jika belum ada, buat array kosong)
            let daftarAkun = JSON.parse(localStorage.getItem('semua_akun')) || [];

            // Cek apakah username sudah pernah dipakai
            const sudahAda = daftarAkun.some(akun => akun.username === username);
            if (sudahAda) {
                alert('Username atau email ini sudah terdaftar! Gunakan yang lain atau langsung masuk.');
                return;
            }

            // Tambahkan akun baru ke dalam daftar tanpa menghapus akun sebelumnya
            daftarAkun.push({ nama: nama, username: username, password: password });
            localStorage.setItem('semua_akun', JSON.stringify(daftarAkun));

            alert('Akun berhasil dibuat! Silakan masuk.');
            window.location.href = 'index.html';
        }
    </script>

</body>
</html>
